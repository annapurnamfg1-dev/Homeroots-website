<!DOCTYPE html>
<html>
<head><title>Debug Storage</title></head>
<body style="font-family:monospace; padding:20px; word-break:break-all; white-space:pre-wrap;">
<h3>hr_registered_vendors — Audit Test Controls</h3>
<button onclick="setActive()">SET ACTIVE TEST</button>
<button onclick="setMixed()">SET MIXED TEST</button>
<button onclick="cleanup()">CLEANUP TEST DATA</button>
<button onclick="show()">REFRESH VIEW</button>
<hr>
<pre id="out">loading...</pre>

<script>
var KEY = 'hr_registered_vendors';

function getArr(){
  var raw = localStorage.getItem(KEY);
  try {
    var parsed = JSON.parse(raw);
    if (Array.isArray(parsed)) return parsed;
    return [];
  } catch(e){
    return [];
  }
}

function saveArr(arr){
  localStorage.setItem(KEY, JSON.stringify(arr));
}

function setActive(){
  var arr = getArr();
  arr.unshift({
    nm: "TEST_ACTIVE_VENDOR",
    ph: "9990000002",
    cat: "Architect",
    listingActive: true,
    verified: false,
    regId: "TEST-ACTIVE-001",
    submittedAt: new Date().toISOString()
  });
  saveArr(arr);
  show();
}

function setMixed(){
  var arr = getArr();
  arr.unshift({
    nm: "TEST_ACTIVE_VENDOR_MIXED",
    ph: "9990000004",
    cat: "Architect",
    listingActive: true,
    verified: false,
    regId: "TEST-MIXED-002",
    submittedAt: new Date().toISOString()
  });
  arr.unshift({
    nm: "TEST_PENDING_VENDOR_MIXED",
    ph: "9990000003",
    cat: "Architect",
    listingActive: false,
    verified: false,
    regId: "TEST-MIXED-001",
    submittedAt: new Date().toISOString()
  });
  saveArr(arr);
  show();
}

function cleanup(){
  var arr = getArr();
  var filtered = arr.filter(function(v){
    var nm = (v && v.nm) ? v.nm : '';
    return nm.indexOf('TEST_') !== 0;
  });
  saveArr(filtered);
  show();
}

function show(){
  var arr = getArr();
  document.getElementById('out').textContent = JSON.stringify(arr, null, 2);
}

show();
</script>
</body>
</html>
