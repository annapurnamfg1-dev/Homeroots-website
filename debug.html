<!DOCTYPE html>
<html>
<head><title>Debug Storage</title></head>
<body style="font-family:monospace; padding:20px; word-break:break-all; white-space:pre-wrap;">
<h3>hr_registered_vendors:</h3>
<pre id="out">loading...</pre>
<script>
  var raw = localStorage.getItem('hr_registered_vendors');
  try {
    var parsed = JSON.parse(raw);
    document.getElementById('out').textContent = JSON.stringify(parsed, null, 2);
  } catch(e) {
    document.getElementById('out').textContent = 'RAW (not valid JSON or null):\n' + raw;
  }
</script>
</body>
</html>
